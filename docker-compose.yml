# ADOFAI Diffusion — Docker Compose（CPU 推理）
#
# 启动：docker compose up -d --build
# 停止：docker compose down
# 日志：docker compose logs -f
#
# GPU 版：把 Dockerfile 里 pip 安装的 torch/torchaudio 换成 cu 索引版本，
# 并在下面加
#   deploy.resources.reservations.devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
services:
  adofai:
    build: .
    image: adofai-diffusion:latest
    container_name: adofai-diffusion
    ports:
      - "8420:8420"
    volumes:
      # 模型权重 + 运行缓存（*.pt 放 data/checkpoints —— 需先从 GitHub Releases 下载
      # data.zip，见 README 第 0 步；demucs 分离结果落这里持久化）
      - ./data:/app/data
      # 训练数据集（wav + .adofai 谱面）
      - ./train_data:/app/train_data
      # 注意：torch_hub（beat_this 权重）已打进镜像，不用挂载；
      # 想要缓存自己下载的其它权重，可临时加一行  ./torch_hub:/app/torch_hub
    environment:
      # 代码实际读取的变量名见 app/paths.py:16,55 / app/training/train_onset.py:240
      # （Dockerfile 里 ENV 已设好，这里显式写一遍方便改）
      ADOFAI_DATA_DIR: /app/data
      ADOFAI_TRAIN_DIR: /app/train_data
      TORCH_HOME: /app/torch_hub
      # 运行时目录（训练日志/预览图/训练产出）基准，Linux 下取 LOCALAPPDATA 或 ~
      LOCALAPPDATA: /app/data
    restart: unless-stopped
